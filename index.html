<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة إدارة المدارس ومراكز التعليم — School SaaS</title>
    
    <!-- Arabic Typography: Cairo, Almarai, Tajawal, and IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var fontMap = {
            'cairo': "'Cairo', sans-serif",
            'almarai': "'Almarai', sans-serif",
            'tajawal': "'Tajawal', sans-serif",
            'ibm-plex': "'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          };
          var sizeMap = {
            'sm': '14.5px',
            'md': '16px',
            'lg': '17px',
            'xl': '18px',
            '2xl': '19.5px'
          };
          var savedFont = localStorage.getItem('school_app_font_id');
          if (savedFont && fontMap[savedFont]) {
            document.documentElement.style.setProperty('--font-family', fontMap[savedFont]);
          }
          var savedSize = localStorage.getItem('school_app_font_size_id');
          if (savedSize && sizeMap[savedSize]) {
            document.documentElement.style.fontSize = sizeMap[savedSize];
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
